name: Publish

on:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: publish-${{ github.event.release.tag_name || github.ref }}
  cancel-in-progress: false

jobs:
  marketplace:
    name: VS Code Marketplace
    runs-on: ubuntu-latest
    environment: vscode-marketplace
    steps:
      - name: Check out release
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'release' && github.event.release.tag_name || github.ref }}

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply release version
        if: github.event_name == 'release'
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          case "$RELEASE_TAG" in
            v*) ;;
            *)
              echo "Release tag must use the v<version> format"
              exit 1
              ;;
          esac

          npm version "${RELEASE_TAG#v}" \
            --workspaces \
            --include-workspace-root \
            --no-git-tag-version \
            --allow-same-version

      - name: Validate extension
        run: npm run check

      - name: Verify Marketplace credentials
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: npm run verify:marketplace --workspace skeleton

      - name: Validate release tag
        if: github.event_name == 'release'
        run: npm run check:release --workspace skeleton -- "${{ github.event.release.tag_name }}"

      - name: Verify minimum compatible skelc is released
        if: github.event_name == 'release'
        run: |
          minimum_version=$(node -p 'require(process.argv[1]).minimumVersion' './editors/vscode/skelc-compatibility.json')
          git ls-remote --exit-code --tags https://github.com/yorun-ai/skelc.git "refs/tags/$minimum_version"

      - name: Verify release commit is on main
        if: github.event_name == 'release'
        run: |
          git fetch origin main
          git merge-base --is-ancestor HEAD origin/main

      - name: Create release directory
        if: github.event_name == 'release'
        run: mkdir -p "$GITHUB_WORKSPACE/dist"

      - name: Package extension
        if: github.event_name == 'release'
        run: npm run package:vsix --workspace skeleton -- --out "$GITHUB_WORKSPACE/dist/skeleton-${{ github.event.release.tag_name }}.vsix"

      - name: Publish extension
        if: github.event_name == 'release'
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: npm run publish:marketplace --workspace skeleton -- --packagePath "$GITHUB_WORKSPACE/dist/skeleton-${{ github.event.release.tag_name }}.vsix"

  npm:
    name: npm
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out release
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.release.tag_name }}

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci

      - name: Apply release version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          case "$RELEASE_TAG" in
            v*) ;;
            *)
              echo "Release tag must use the v<version> format"
              exit 1
              ;;
          esac

          npm version "${RELEASE_TAG#v}" \
            --workspaces \
            --include-workspace-root \
            --no-git-tag-version \
            --allow-same-version

      - name: Validate package
        run: npm run check --workspace @yorun-ai/skel-highlight

      - name: Verify minimum compatible skelc is released
        env:
          SKELC_COMPATIBILITY_FILE: ./editors/vscode/skelc-compatibility.json
        run: |
          minimum_version=$(node -p 'require(process.argv[1]).minimumVersion' "$SKELC_COMPATIBILITY_FILE")
          git ls-remote --exit-code --tags https://github.com/yorun-ai/skelc.git "refs/tags/$minimum_version"

      - name: Verify release commit is on main
        run: |
          git fetch origin main
          git merge-base --is-ancestor HEAD origin/main

      - name: Publish package
        run: npm publish --workspace @yorun-ai/skel-highlight

  jetbrains:
    name: JetBrains Marketplace
    if: github.event_name == 'release' && vars.JETBRAINS_MARKETPLACE_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment: jetbrains-marketplace
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.release.tag_name }}
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Validate release version and ancestry
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          node -e 'if (!/^v[0-9]+\.[0-9]+\.[0-9]+$/.test(process.env.RELEASE_TAG) || process.env.RELEASE_TAG === "v0.0.0") process.exit(1)'
          git fetch origin main
          git merge-base --is-ancestor HEAD origin/main
          echo "ORG_GRADLE_PROJECT_pluginVersion=${RELEASE_TAG#v}" >> "$GITHUB_ENV"
      - name: Read minimum supported skelc
        id: compatibility
        run: echo "version=$(node -p 'require("./editors/vscode/skelc-compatibility.json").minimumVersion')" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v7
        with:
          repository: yorun-ai/skelc
          ref: ${{ steps.compatibility.outputs.version }}
          path: .test/skelc-jetbrains
      - uses: actions/setup-go@v7
        with:
          go-version-file: .test/skelc-jetbrains/go.mod
          cache-dependency-path: .test/skelc-jetbrains/go.sum
      - name: Build skelc
        working-directory: .test/skelc-jetbrains
        run: GOWORK=off go build -o "$RUNNER_TEMP/skelc" ./cmd/skelc
      - name: Test and verify plugin
        working-directory: editors/jetbrains
        env:
          SKELC_PATH: ${{ runner.temp }}/skelc
        run: xvfb-run -a ./gradlew test verifyPlugin
      - name: Sign and publish plugin
        working-directory: editors/jetbrains
        env:
          JETBRAINS_MARKETPLACE_TOKEN: ${{ secrets.JETBRAINS_MARKETPLACE_TOKEN }}
          JETBRAINS_CERTIFICATE_CHAIN: ${{ secrets.JETBRAINS_CERTIFICATE_CHAIN }}
          JETBRAINS_PRIVATE_KEY: ${{ secrets.JETBRAINS_PRIVATE_KEY }}
          JETBRAINS_PRIVATE_KEY_PASSWORD: ${{ secrets.JETBRAINS_PRIVATE_KEY_PASSWORD }}
        run: |
          test -n "$JETBRAINS_MARKETPLACE_TOKEN"
          test -n "$JETBRAINS_CERTIFICATE_CHAIN"
          test -n "$JETBRAINS_PRIVATE_KEY"
          ./gradlew publishPlugin
