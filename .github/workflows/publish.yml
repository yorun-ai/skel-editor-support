name: Publish

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag (vX.Y.Z)
        required: true
        type: string
      artifacts:
        description: Recover only the selected publication
        type: choice
        options: [all, vscode, npm, jetbrains]
        default: all

permissions:
  contents: read

concurrency:
  group: publish-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  validate:
    name: Validate release and prepare draft
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    outputs:
      commit: ${{ steps.release.outputs.commit }}
      vscode: ${{ steps.release.outputs.vscode }}
      npm: ${{ steps.release.outputs.npm }}
      jetbrains: ${{ steps.release.outputs.jetbrains }}
    steps:
      - uses: actions/checkout@v7
        with:
          path: automation
      - uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}
          fetch-depth: 0
          path: source
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Validate release
        id: release
        working-directory: source
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACTS: ${{ inputs.artifacts || 'all' }}
          JETBRAINS_ENABLED: ${{ vars.JETBRAINS_MARKETPLACE_ENABLED }}
        run: node ../automation/scripts/release-policy.mjs

  marketplace:
    name: VS Code Marketplace
    needs: validate
    if: needs.validate.outputs.vscode == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: vscode-marketplace
    permissions:
      contents: write
    steps:
      - name: Check out release
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ needs.validate.outputs.commit }}

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply release version
        env:
          RELEASE_TAG: ${{ env.RELEASE_TAG }}
        run: |
          case "$RELEASE_TAG" in
            v*) ;;
            *)
              echo "Release tag must use the v<version> format"
              exit 1
              ;;
          esac

          npm version "${RELEASE_TAG#v}" \
            --workspaces \
            --include-workspace-root \
            --no-git-tag-version \
            --allow-same-version

      - name: Validate extension
        run: npm run check --workspace skeleton

      - name: Validate release tag
        run: npm run check:release --workspace skeleton -- "${{ env.RELEASE_TAG }}"

      - name: Create release directory
        run: mkdir -p "$GITHUB_WORKSPACE/dist"

      - name: Package extension
        run: npm run package:vsix --workspace skeleton -- --out "$GITHUB_WORKSPACE/dist/skeleton-${{ env.RELEASE_TAG }}.vsix"

      - name: Publish extension
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: npm run publish:marketplace --workspace skeleton -- --packagePath "$GITHUB_WORKSPACE/dist/skeleton-${{ env.RELEASE_TAG }}.vsix"

      - name: Check out publication helper
        uses: actions/checkout@v7
        with:
          path: publication-automation
      - name: Record successful submission
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_COMMIT: ${{ needs.validate.outputs.commit }}
          PUBLICATION_CHANNEL: vscode
        run: node publication-automation/scripts/release-publication.mjs record

  npm:
    name: npm
    needs: validate
    if: needs.validate.outputs.npm == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: npm
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Check out release
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ needs.validate.outputs.commit }}

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci

      - name: Apply release version
        env:
          RELEASE_TAG: ${{ env.RELEASE_TAG }}
        run: |
          case "$RELEASE_TAG" in
            v*) ;;
            *)
              echo "Release tag must use the v<version> format"
              exit 1
              ;;
          esac

          npm version "${RELEASE_TAG#v}" \
            --workspaces \
            --include-workspace-root \
            --no-git-tag-version \
            --allow-same-version

      - name: Validate package
        run: npm run check --workspace @yorun-ai/skel-highlight

      - name: Publish package
        run: npm publish --workspace @yorun-ai/skel-highlight

      - name: Check out publication helper
        uses: actions/checkout@v7
        with:
          path: publication-automation
      - name: Record successful submission
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_COMMIT: ${{ needs.validate.outputs.commit }}
          PUBLICATION_CHANNEL: npm
        run: node publication-automation/scripts/release-publication.mjs record

  jetbrains:
    name: JetBrains Marketplace
    needs: validate
    if: needs.validate.outputs.jetbrains == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: jetbrains-marketplace
    permissions:
      contents: write
    steps:
      - name: Check JetBrains publishing credentials
        env:
          JETBRAINS_MARKETPLACE_TOKEN: ${{ secrets.JETBRAINS_MARKETPLACE_TOKEN }}
          JETBRAINS_CERTIFICATE_CHAIN: ${{ secrets.JETBRAINS_CERTIFICATE_CHAIN }}
          JETBRAINS_PRIVATE_KEY: ${{ secrets.JETBRAINS_PRIVATE_KEY }}
        run: |
          if [ -z "${JETBRAINS_MARKETPLACE_TOKEN//[[:space:]]/}" ]; then
            echo "JETBRAINS_MARKETPLACE_TOKEN is required" >&2
            exit 1
          fi
          certificate="${JETBRAINS_CERTIFICATE_CHAIN//[[:space:]]/}"
          key="${JETBRAINS_PRIVATE_KEY//[[:space:]]/}"
          if { [ -n "$certificate" ] && [ -z "$key" ]; } || { [ -z "$certificate" ] && [ -n "$key" ]; }; then
            echo "Set both JETBRAINS_CERTIFICATE_CHAIN and JETBRAINS_PRIVATE_KEY, or leave both unset" >&2
            exit 1
          fi
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ needs.validate.outputs.commit }}
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
      - name: Apply release version
        run: echo "ORG_GRADLE_PROJECT_pluginVersion=${RELEASE_TAG#v}" >> "$GITHUB_ENV"
      - name: Verify release plugin
        timeout-minutes: 40
        working-directory: editors/jetbrains
        run: ./gradlew verifyPlugin
      - name: Publish plugin (sign when configured)
        timeout-minutes: 10
        working-directory: editors/jetbrains
        env:
          JETBRAINS_MARKETPLACE_TOKEN: ${{ secrets.JETBRAINS_MARKETPLACE_TOKEN }}
          JETBRAINS_CERTIFICATE_CHAIN: ${{ secrets.JETBRAINS_CERTIFICATE_CHAIN }}
          JETBRAINS_PRIVATE_KEY: ${{ secrets.JETBRAINS_PRIVATE_KEY }}
          JETBRAINS_PRIVATE_KEY_PASSWORD: ${{ secrets.JETBRAINS_PRIVATE_KEY_PASSWORD }}
        run: |
          test -n "$JETBRAINS_MARKETPLACE_TOKEN"
          ./gradlew publishPlugin

      - name: Check out publication helper
        uses: actions/checkout@v7
        with:
          path: publication-automation
      - name: Record successful submission
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_COMMIT: ${{ needs.validate.outputs.commit }}
          PUBLICATION_CHANNEL: jetbrains
        run: node publication-automation/scripts/release-publication.mjs record

  complete:
    name: Verify channels and publish Release
    if: ${{ always() }}
    needs: [validate, marketplace, npm, jetbrains]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Verify every required submission
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_COMMIT: ${{ needs.validate.outputs.commit }}
          JETBRAINS_ENABLED: ${{ vars.JETBRAINS_MARKETPLACE_ENABLED }}
          NEEDS: ${{ toJSON(needs) }}
        run: node scripts/release-publication.mjs complete
