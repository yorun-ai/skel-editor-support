name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate editor support packages
        run: npm run check

      - name: Read skelc compatibility
        id: skelc-compatibility
        run: |
          echo "minimum=$(node -p 'require(process.argv[1]).minimumVersion' './editors/vscode/skelc-compatibility.json')" >> "$GITHUB_OUTPUT"
          echo "latest=$(node -p 'require(process.argv[1]).latestTestedVersion' './editors/vscode/skelc-compatibility.json')" >> "$GITHUB_OUTPUT"

      - name: Check out minimum supported skelc
        uses: actions/checkout@v7
        with:
          repository: yorun-ai/skelc
          ref: ${{ steps.skelc-compatibility.outputs.minimum }}
          path: .test/skelc-minimum

      - name: Check out latest tested skelc
        uses: actions/checkout@v7
        with:
          repository: yorun-ai/skelc
          ref: ${{ steps.skelc-compatibility.outputs.latest }}
          path: .test/skelc-latest

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: .test/skelc-latest/go.mod
          cache-dependency-path: |
            .test/skelc-minimum/go.sum
            .test/skelc-latest/go.sum

      - name: Build minimum supported skelc language server
        working-directory: .test/skelc-minimum
        run: GOWORK=off go build -o "$RUNNER_TEMP/skelc-minimum" ./cmd/skelc

      - name: Build latest tested skelc language server
        working-directory: .test/skelc-latest
        run: GOWORK=off go build -o "$RUNNER_TEMP/skelc-latest" ./cmd/skelc

      - name: Test minimum supported skelc LSP integration
        env:
          SKELC_PATH: ${{ runner.temp }}/skelc-minimum
        run: npm run test:integration

      - name: Test latest skelc LSP integration
        env:
          SKELC_PATH: ${{ runner.temp }}/skelc-latest
        run: npm run test:integration

      - name: Test minimum supported skelc in Extension Host
        env:
          SKELC_PATH: ${{ runner.temp }}/skelc-minimum
          VSCODE_VERSION: "1.91.0"
        run: xvfb-run -a npm run test:extension

      - name: Test latest skelc in Extension Host
        env:
          SKELC_PATH: ${{ runner.temp }}/skelc-latest
          VSCODE_VERSION: "1.91.0"
        run: xvfb-run -a npm run test:extension

  highlight-compatibility:
    name: Highlight compatibility (Node ${{ matrix.node-version }}, ${{ matrix.peer-set }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - node-version: 20
            peer-set: locked
          - node-version: 24
            peer-set: locked
          - node-version: 24
            peer-set: latest-compatible
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install dependencies with the repository Node.js version
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Select compatibility Node.js version
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install latest compatible highlighter peers
        if: matrix.peer-set == 'latest-compatible'
        run: >-
          npm install --no-save --package-lock=false
          @codemirror/language@^6
          @wooorm/starry-night@^3
          highlight.js@^11
          lowlight@^3
          monaco-editor@0.56.0
          prismjs@^1
          refractor@^5
          shiki@^4

      - name: Validate syntax-highlighting consumers
        run: npm run check --workspace @yorun-ai/skel-highlight

  ci-checks:
    name: CI / Required Checks
    if: ${{ always() }}
    needs: [check, highlight-compatibility]
    runs-on: ubuntu-latest
    steps:
      - name: Verify CI results
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: echo "$NEEDS" | jq --exit-status 'all(.[]; .result == "success")'
