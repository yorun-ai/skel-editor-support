name: Publish

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag (vX.Y.Z)
        required: true
        type: string
      artifacts:
        description: Recover only the selected publication
        type: choice
        options: [all, vscode, npm]
        default: all

permissions:
  contents: read

concurrency:
  group: publish-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  validate:
    name: Validate release and prepare draft
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    outputs:
      commit: ${{ steps.release.outputs.commit }}
      vscode: ${{ steps.release.outputs.vscode }}
      npm: ${{ steps.release.outputs.npm }}
    steps:
      - uses: actions/checkout@v7
        with:
          path: automation
      - uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}
          fetch-depth: 0
          path: source
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Validate release
        id: release
        working-directory: source
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACTS: ${{ inputs.artifacts || 'all' }}
        run: node ../automation/scripts/release-policy.mjs

  marketplace:
    name: VS Code Marketplace
    needs: validate
    if: needs.validate.outputs.vscode == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: vscode-marketplace
    permissions:
      contents: write
    steps:
      - name: Check out release
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ needs.validate.outputs.commit }}

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply release version
        env:
          RELEASE_TAG: ${{ env.RELEASE_TAG }}
        run: |
          case "$RELEASE_TAG" in
            v*) ;;
            *)
              echo "Release tag must use the v<version> format"
              exit 1
              ;;
          esac

          npm version "${RELEASE_TAG#v}" \
            --workspaces \
            --include-workspace-root \
            --no-git-tag-version \
            --allow-same-version

      - name: Validate extension
        run: npm run check --workspace skeleton

      - name: Validate release tag
        run: npm run check:release --workspace skeleton -- "${{ env.RELEASE_TAG }}"

      - name: Create release directory
        run: mkdir -p "$GITHUB_WORKSPACE/dist"

      - name: Package extension
        run: npm run package:vsix --workspace skeleton -- --out "$GITHUB_WORKSPACE/dist/skeleton-${{ env.RELEASE_TAG }}.vsix"

      - name: Publish extension
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: npm run publish:marketplace --workspace skeleton -- --packagePath "$GITHUB_WORKSPACE/dist/skeleton-${{ env.RELEASE_TAG }}.vsix"

      - name: Check out publication helper
        uses: actions/checkout@v7
        with:
          path: publication-automation
      - name: Record successful submission
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_COMMIT: ${{ needs.validate.outputs.commit }}
          PUBLICATION_CHANNEL: vscode
        run: node publication-automation/scripts/release-publication.mjs record

  npm:
    name: npm
    needs: validate
    if: needs.validate.outputs.npm == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: npm
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Check out release
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ needs.validate.outputs.commit }}

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci

      - name: Apply release version
        env:
          RELEASE_TAG: ${{ env.RELEASE_TAG }}
        run: |
          case "$RELEASE_TAG" in
            v*) ;;
            *)
              echo "Release tag must use the v<version> format"
              exit 1
              ;;
          esac

          npm version "${RELEASE_TAG#v}" \
            --workspaces \
            --include-workspace-root \
            --no-git-tag-version \
            --allow-same-version

      - name: Validate package
        run: npm run check --workspace @yorun-ai/skel-highlight

      - name: Publish package
        run: npm publish --workspace @yorun-ai/skel-highlight

      - name: Check out publication helper
        uses: actions/checkout@v7
        with:
          path: publication-automation
      - name: Record successful submission
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_COMMIT: ${{ needs.validate.outputs.commit }}
          PUBLICATION_CHANNEL: npm
        run: node publication-automation/scripts/release-publication.mjs record

  complete:
    name: Verify channels and publish Release
    if: ${{ always() }}
    needs: [validate, marketplace, npm]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Verify every required submission
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_COMMIT: ${{ needs.validate.outputs.commit }}
          NEEDS: ${{ toJSON(needs) }}
        run: node scripts/release-publication.mjs complete
