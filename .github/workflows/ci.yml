name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      node: ${{ steps.scope.outputs.node }}
      vscode: ${{ steps.scope.outputs.vscode }}
      highlight: ${{ steps.scope.outputs.highlight }}
      jetbrains: ${{ steps.scope.outputs.jetbrains }}
      full: ${{ steps.scope.outputs.full }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Test change classification
        run: node --test scripts/ci-scope.test.mjs
      - name: Select checks
        id: scope
        env:
          CI_EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if [ "$CI_EVENT_NAME" = pull_request ]; then
            git diff --name-only --no-renames -z "$BASE_SHA" "$HEAD_SHA" | node scripts/ci-scope.mjs
          else
            node scripts/ci-scope.mjs </dev/null
          fi

  check:
    name: Package checks
    needs: changes
    if: needs.changes.outputs.node == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check

  vscode:
    name: VS Code integration
    needs: changes
    if: needs.changes.outputs.vscode == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build editor support packages
        run: npm run build

      - name: Read skelc compatibility
        id: skelc-compatibility
        run: |
          echo "minimum=$(node -p 'require(process.argv[1]).minimumVersion' './editors/vscode/skelc-compatibility.json')" >> "$GITHUB_OUTPUT"
          echo "latest=$(node -p 'require(process.argv[1]).latestTestedVersion' './editors/vscode/skelc-compatibility.json')" >> "$GITHUB_OUTPUT"

      - name: Resolve skelc source refs
        id: skelc-source
        env:
          MINIMUM_VERSION: ${{ steps.skelc-compatibility.outputs.minimum }}
          LATEST_VERSION: ${{ steps.skelc-compatibility.outputs.latest }}
        run: |
          resolve_ref() {
            name="$1"
            version="$2"
            if git ls-remote --exit-code --tags https://github.com/yorun-ai/skelc.git "refs/tags/$version" >/dev/null; then
              echo "${name}_ref=$version" >> "$GITHUB_OUTPUT"
              echo "${name}_ldflags=" >> "$GITHUB_OUTPUT"
            else
              echo "${name}_ref=main" >> "$GITHUB_OUTPUT"
              echo "${name}_ldflags=-X go.yorun.ai/skelc/internal/cli.ldModuleVersion=v0.0.0-dev" >> "$GITHUB_OUTPUT"
            fi
          }
          resolve_ref minimum "$MINIMUM_VERSION"
          resolve_ref latest "$LATEST_VERSION"

      - name: Check out minimum supported skelc
        uses: actions/checkout@v7
        with:
          repository: yorun-ai/skelc
          ref: ${{ steps.skelc-source.outputs.minimum_ref }}
          path: .test/skelc-minimum

      - name: Check out latest tested skelc
        uses: actions/checkout@v7
        with:
          repository: yorun-ai/skelc
          ref: ${{ steps.skelc-source.outputs.latest_ref }}
          path: .test/skelc-latest

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: .test/skelc-latest/go.mod
          cache-dependency-path: |
            .test/skelc-minimum/go.sum
            .test/skelc-latest/go.sum

      - name: Build minimum supported skelc language server
        working-directory: .test/skelc-minimum
        env:
          SKELC_LDFLAGS: ${{ steps.skelc-source.outputs.minimum_ldflags }}
        run: GOWORK=off go build -ldflags "$SKELC_LDFLAGS" -o "$RUNNER_TEMP/skelc-minimum" ./cmd/skelc

      - name: Build latest tested skelc language server
        working-directory: .test/skelc-latest
        env:
          SKELC_LDFLAGS: ${{ steps.skelc-source.outputs.latest_ldflags }}
        run: GOWORK=off go build -ldflags "$SKELC_LDFLAGS" -o "$RUNNER_TEMP/skelc-latest" ./cmd/skelc

      - name: Test minimum supported skelc LSP integration
        env:
          SKELC_PATH: ${{ runner.temp }}/skelc-minimum
        run: npm run test:integration

      - name: Test latest skelc LSP integration
        env:
          SKELC_PATH: ${{ runner.temp }}/skelc-latest
        run: npm run test:integration

      - name: Test minimum supported skelc in Extension Host
        env:
          SKELC_PATH: ${{ runner.temp }}/skelc-minimum
          VSCODE_VERSION: "1.91.0"
        run: xvfb-run -a npm run test:extension

      - name: Test latest skelc in Extension Host
        env:
          SKELC_PATH: ${{ runner.temp }}/skelc-latest
          VSCODE_VERSION: "1.91.0"
        run: xvfb-run -a npm run test:extension

  highlight-compatibility:
    needs: changes
    if: needs.changes.outputs.full == 'true'
    name: Highlight compatibility (Node ${{ matrix.node-version }}, ${{ matrix.peer-set }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - node-version: 20
            peer-set: locked
          - node-version: 24
            peer-set: locked
          - node-version: 24
            peer-set: latest-compatible
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install dependencies with the repository Node.js version
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Select compatibility Node.js version
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install latest compatible highlighter peers
        if: matrix.peer-set == 'latest-compatible'
        run: >-
          npm install --no-save --package-lock=false
          @codemirror/language@^6
          @wooorm/starry-night@^3
          highlight.js@^11
          lowlight@^3
          monaco-editor@0.56.0
          prismjs@^1
          refractor@^5
          shiki@^4

      - name: Validate syntax-highlighting consumers
        run: npm run check --workspace @yorun-ai/skel-highlight

  jetbrains:
    needs: changes
    if: needs.changes.outputs.jetbrains == 'true'
    name: JetBrains plugin
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Read minimum supported skelc
        id: compatibility
        run: echo "version=$(node -p 'require("./editors/vscode/skelc-compatibility.json").minimumVersion')" >> "$GITHUB_OUTPUT"
      - name: Check out minimum supported skelc
        uses: actions/checkout@v7
        with:
          repository: yorun-ai/skelc
          ref: ${{ steps.compatibility.outputs.version }}
          path: .test/skelc-jetbrains
      - uses: actions/setup-go@v7
        with:
          go-version-file: .test/skelc-jetbrains/go.mod
          cache-dependency-path: .test/skelc-jetbrains/go.sum
      - name: Build skelc
        working-directory: .test/skelc-jetbrains
        run: GOWORK=off go build -o "$RUNNER_TEMP/skelc" ./cmd/skelc
      - name: Test plugin
        working-directory: editors/jetbrains
        env:
          SKELC_PATH: ${{ runner.temp }}/skelc
        run: xvfb-run -a ./gradlew test
      - name: Verify supported IDEs
        if: needs.changes.outputs.full == 'true'
        working-directory: editors/jetbrains
        run: ./gradlew verifyPlugin

  ci-checks:
    name: CI / Required Checks
    if: ${{ always() }}
    needs: [changes, check, vscode, highlight-compatibility, jetbrains]
    runs-on: ubuntu-latest
    steps:
      - name: Verify CI results
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS" | jq --exit-status '
            .changes.result == "success" and
            (.changes.outputs as $scope |
              (.check.result == (if $scope.node == "true" then "success" else "skipped" end)) and
              (.vscode.result == (if $scope.vscode == "true" then "success" else "skipped" end)) and
              (.jetbrains.result == (if $scope.jetbrains == "true" then "success" else "skipped" end)) and
              (."highlight-compatibility".result == (if $scope.full == "true" then "success" else "skipped" end)))'
